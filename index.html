<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TB Al-Barkah</title>
<meta name="theme-color" content="#135EDD">
<meta name="description" content="Sistem administrasi Taman Belajar Al-Barkah: presensi, catatan, nilai, dan rapor.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--biru:#135EDD;--biru-tua:#0E47A8;--biru-muda:#E8EFFC;--kuning:#F2C502;--kuning-muda:#FFF7D1;--hijau:#1E9E6A;--hijau-muda:#E5F5EE;
--merah:#D9435B;--merah-muda:#FDEBEF;--oranye:#EE7B1C;--ink:#1E2A44;--muted:#64708A;--garis:#E3E8F0;--bg:#F5F7FB;--putih:#fff;
--r:16px;--bayang:0 1px 2px rgba(30,42,68,.06),0 4px 16px rgba(30,42,68,.06);--nav-h:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--biru);text-decoration:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* ---------- tombol & input ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .08s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-utama{background:var(--biru);color:#fff}.btn-utama:hover{background:var(--biru-tua)}
.btn-kuning{background:var(--kuning);color:var(--ink)}
.btn-garis{background:#fff;border:1.5px solid var(--garis);color:var(--ink)}.btn-garis:hover{border-color:#C9D3E3}
.btn-hapus{background:var(--merah-muda);color:var(--merah)}
.btn-teks{height:36px;padding:0 10px;color:var(--biru)}
.btn-kecil{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-ikon{width:40px;height:40px;padding:0;border-radius:12px;display:inline-grid;place-items:center;color:var(--muted)}
.btn-ikon:hover{background:var(--bg);color:var(--ink)}
.btn-blok{width:100%}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:putar .7s linear infinite}
.btn-garis .spin,.btn-teks .spin{border-color:rgba(19,94,221,.25);border-top-color:var(--biru)}
@keyframes putar{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field label b{color:var(--merah);font-weight:600}
.input,select.input,textarea.input{width:100%;height:46px;border:1.5px solid var(--garis);border-radius:12px;padding:0 14px;background:#fff;font-size:15px;outline:none;transition:border .15s,box-shadow .15s}
textarea.input{height:auto;min-height:110px;padding:12px 14px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.input:focus{border-color:var(--biru);box-shadow:0 0 0 4px rgba(19,94,221,.12)}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:500;color:var(--muted);font-size:13.5px}
.seg button.on{background:#fff;color:var(--biru);box-shadow:var(--bayang);font-weight:600}
.cek{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--garis);border-radius:12px;cursor:pointer;margin-bottom:14px}
.cek input{width:20px;height:20px;accent-color:var(--biru);margin-top:2px;flex:none}
.cek span{font-size:13.5px}.cek small{display:block;color:var(--muted);font-size:12px}
.saklar{position:relative;width:46px;height:26px;flex:none}
.saklar input{opacity:0;width:0;height:0}
.saklar span{position:absolute;inset:0;background:#CBD3E1;border-radius:99px;transition:.2s}
.saklar span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.saklar input:checked+span{background:var(--hijau)}.saklar input:checked+span::after{left:23px}

/* ---------- kerangka ---------- */
#app{min-height:100%}
.shell{min-height:100vh;padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:60px;padding:0 14px;background:rgba(245,247,251,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar img{height:34px}
.topbar h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--kuning);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.b{background:var(--biru);color:#fff}
.konten{padding:4px 14px 84px;max-width:1080px;margin:0 auto}
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--garis);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.botnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:500}
.botnav button.on{color:var(--biru)}
.botnav button.on .nb{background:var(--biru-muda)}
.nb{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.demo-pita{background:var(--kuning);color:var(--ink);font-size:12px;text-align:center;padding:6px 10px;font-weight:500}

@media (min-width:900px){
  .shell{display:grid;grid-template-columns:248px 1fr;padding-bottom:0}
  .sidebar{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--garis);padding:18px 14px}
  .sidebar .logo{height:54px;object-fit:contain;object-position:left;margin:0 8px 18px}
  .menu{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;margin:0 -6px 10px;padding:0 6px 22px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);scrollbar-width:thin;scrollbar-color:#D5DCE8 transparent}
  .menu::-webkit-scrollbar{width:6px}.menu::-webkit-scrollbar-thumb{background:#D5DCE8;border-radius:9px}
  .menu button{display:flex;align-items:center;gap:12px;height:42px;flex:none;padding:0 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left}
  .menu button:hover{background:var(--bg);color:var(--ink)}
  .menu button.on{background:var(--biru-muda);color:var(--biru);font-weight:600}
  .menu .sep{height:1px;flex:none;background:var(--garis);margin:8px 10px}
  .profil{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);flex:none}
  .profil>div:not(.avatar){flex:1;min-width:0}.profil b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profil small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .botnav{display:none}
  .topbar{height:72px;padding:0 28px;background:var(--bg)}
  .topbar img,.topbar .avatar{display:none}
  .topbar h1{font-size:22px}
  .konten{padding:0 28px 40px}
}

/* ---------- kartu & komponen ---------- */
.kartu{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:16px}
.kartu+.kartu{margin-top:12px}
.judul-bag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.judul-bag h2{font-size:15px;font-weight:700}
.sapa{margin:6px 2px 14px}.sapa small{color:var(--muted);font-size:13px}.sapa h2{font-size:20px;font-weight:700;line-height:1.3}
.hari{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);color:#fff;background:linear-gradient(120deg,var(--biru),#3E7FF0);position:relative;overflow:hidden}
.hari.libur{background:linear-gradient(120deg,#E08A00,var(--kuning));color:var(--ink)}
.hari .tgl{width:56px;height:60px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.hari .tgl b{font-size:22px;line-height:1}.hari .tgl small{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.hari .ket b{display:block;font-size:16px}.hari .ket span{font-size:13px;opacity:.92}
.hari svg.hias{position:absolute;right:-12px;top:-12px;width:110px;height:110px;opacity:.18}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:14px;display:flex;gap:12px;align-items:center}
.stat .ik{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:20px;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}
.kelas-grid{display:grid;grid-template-columns:1fr;gap:10px}
.kelas-kartu{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:14px 16px;display:flex;gap:14px;align-items:center;border-left:6px solid var(--k)}
.kelas-kartu .kode{width:54px;height:54px;border-radius:14px;background:var(--k);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.kelas-kartu .kode.gelap{color:var(--ink)}
.kelas-kartu .isi{flex:1;min-width:0}.kelas-kartu .isi b{display:block}.kelas-kartu .isi span{font-size:12.5px;color:var(--muted)}
.angka{text-align:right}.angka b{font-size:22px;line-height:1}.angka small{display:block;font-size:11px;color:var(--muted)}
.cek-list .item{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--garis)}
.cek-list .item:first-child{border-top:0}
.cek-list .bulat{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.cek-list .item div{flex:1;font-size:13.5px}.cek-list small{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.biru{background:var(--biru-muda);color:var(--biru)}.chip.hijau{background:var(--hijau-muda);color:var(--hijau)}
.chip.kuning{background:var(--kuning-muda);color:#8A6A00}.chip.merah{background:var(--merah-muda);color:var(--merah)}
.chip.k{background:#F0F2F6;color:var(--ink);background:color-mix(in srgb,var(--k) 16%,#fff);color:color-mix(in srgb,var(--k) 75%,#000)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cari{flex:1;min-width:180px;position:relative}
.cari svg{position:absolute;left:13px;top:13px;color:var(--muted)}
.cari .input{padding-left:42px}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{height:34px;padding:0 14px;border-radius:99px;border:1.5px solid var(--garis);background:#fff;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.filter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.daftar{display:flex;flex-direction:column;gap:8px}
.baris{background:#fff;border-radius:14px;box-shadow:var(--bayang);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.baris:active{background:#FAFBFD}
.baris .isi{flex:1;min-width:0}.baris .isi b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baris .isi span{font-size:12.5px;color:var(--muted)}
.baris .kanan{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.inisial{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--biru-muda);color:var(--biru)}
.kosong{text-align:center;padding:36px 16px;color:var(--muted)}
.kosong svg{width:72px;height:72px;margin-bottom:6px}
.kosong b{display:block;color:var(--ink);font-size:15px}
.jumlah{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:25;height:54px;padding:0 20px;border-radius:18px;box-shadow:0 8px 24px rgba(19,94,221,.35)}
@media (min-width:900px){.konten{padding-bottom:40px}.fab{position:static;box-shadow:none;height:44px;border-radius:12px}.kelas-grid{grid-template-columns:repeat(2,1fr)}.stat-grid{grid-template-columns:repeat(4,1fr)}}

/* tabel (laptop) */
.tabel-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);overflow:hidden}
table.tabel{width:100%;border-collapse:collapse;font-size:13.5px}
.tabel th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:12px 14px;background:#FAFBFD;border-bottom:1px solid var(--garis)}
.tabel td{padding:11px 14px;border-bottom:1px solid var(--garis)}
.tabel tr:last-child td{border-bottom:0}
.tabel tbody tr{cursor:pointer}.tabel tbody tr:hover{background:#FAFBFD}
.hanya-hp{display:block}.hanya-laptop{display:none}
@media (min-width:900px){.hanya-hp{display:none}.hanya-laptop{display:block}}

/* ---------- lembar (modal) ---------- */
.latar{position:fixed;inset:0;background:rgba(20,28,46,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:pudar .18s}
.lembar{background:#fff;width:100%;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:naik .22s cubic-bezier(.2,.9,.3,1)}
.lembar-kepala{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 20px}
.lembar-kepala h3{flex:1;font-size:16.5px;font-weight:700}
.lembar-isi{padding:6px 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lembar-kaki{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--garis)}
.lembar-kaki .btn{flex:1}
.pegangan{width:40px;height:5px;border-radius:9px;background:#D5DBE6;margin:8px auto 0}
@media (min-width:700px){.latar{align-items:center}.lembar{width:560px;border-radius:22px;max-height:88vh}.lembar.lebar{width:820px}.pegangan{display:none}.lembar-kaki .btn{flex:0 0 auto;min-width:120px}.lembar-kaki{justify-content:flex-end}}
@keyframes naik{from{transform:translateY(40px);opacity:.4}}
@keyframes pudar{from{opacity:0}}
.sub-judul{font-size:12px;font-weight:700;color:var(--biru);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.sub-judul::after{content:'';flex:1;height:1px;background:var(--garis)}
.detail-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--garis);font-size:13.5px}
.detail-row span{width:44%;color:var(--muted);flex:none}.detail-row b{font-weight:500;word-break:break-word}
.kotak-pw{background:var(--kuning-muda);border:1.5px dashed #E6C34A;border-radius:14px;padding:14px;margin:8px 0}
.kotak-pw .pw-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:10px}
.kotak-pw code{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;background:#fff;padding:3px 10px;border-radius:8px;letter-spacing:.06em}
.peringatan{display:flex;gap:10px;background:var(--merah-muda);color:#8E2335;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.info{display:flex;gap:10px;background:var(--biru-muda);color:#123C8C;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tabel-mini{width:100%;border-collapse:collapse;font-size:12px}
.tabel-mini th,.tabel-mini td{border:1px solid var(--garis);padding:5px 7px;text-align:left;white-space:nowrap}
.tabel-mini th{background:#FAFBFD;color:var(--muted);font-weight:600}
.tabel-mini tr.salah td{background:var(--merah-muda)}
.gulir-x{overflow-x:auto;max-height:280px;border-radius:10px;border:1px solid var(--garis)}
.warna-pilih{display:flex;gap:8px;flex-wrap:wrap}
.warna-pilih button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--garis)}
.warna-pilih button.on{box-shadow:0 0 0 2.5px var(--ink)}

/* ---------- toast & konfirmasi ---------- */
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:naik .2s;pointer-events:auto;width:100%}
.toast.sukses svg{color:#6EE7B7}.toast.galat{background:#8E2335}
.toast button{margin-left:auto;color:var(--kuning);font-weight:600;font-size:13px}
@media (min-width:900px){#toast{top:auto;bottom:28px}}

/* ---------- login ---------- */
.masuk-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
radial-gradient(circle at 12% 8%,rgba(242,197,2,.22),transparent 34%),radial-gradient(circle at 92% 90%,rgba(19,94,221,.16),transparent 36%),var(--bg)}
.masuk{width:100%;max-width:400px}
.masuk .logo{display:block;width:210px;margin:0 auto 18px}
.masuk .kartu{padding:22px}
.masuk h2{font-size:19px;font-weight:700;margin-bottom:2px}
.masuk p.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.masuk .kaki{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.pw-wrap{position:relative}.pw-wrap .input{padding-right:48px}
.pw-wrap button{position:absolute;right:4px;top:3px}
.demo-akun{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.demo-akun button{border:1.5px dashed var(--garis);border-radius:12px;padding:8px;font-size:12px;text-align:left;background:#fff}
.demo-akun b{display:block;font-size:13px;color:var(--biru)}

/* ---------- kalender ---------- */
.kal-kepala{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.kal-kepala b{flex:1;text-align:center;font-size:15.5px}
.kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.kal-grid .nh{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.kal-grid .h{aspect-ratio:1/1;max-height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;position:relative;background:#FAFBFD}
.kal-grid .h.lain{visibility:hidden}
.kal-grid .h.pekan{background:#F0F2F6;color:#9AA3B5}
.kal-grid .h.libur{background:var(--kuning-muda);color:#8A6A00}
.kal-grid .h.libur::after{content:'';width:6px;height:6px;border-radius:50%;background:#E0A800;margin-top:2px}
.kal-grid .h.sem{background:#FFE9CF;color:#9A4D00}
.kal-grid .h.sem::after{background:var(--oranye)}
.kal-grid .h.kini{box-shadow:inset 0 0 0 2px var(--biru);color:var(--biru);font-weight:700}
.kal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.kal-leg span{display:inline-flex;align-items:center;gap:6px}
.kal-leg i{width:12px;height:12px;border-radius:4px;display:inline-block}

.nr-draf{margin-top:8px;font-size:12.5px;color:var(--muted)}.nr-draf summary{cursor:pointer;color:var(--biru);font-weight:500}.nr-draf p{margin-top:6px;background:var(--bg);padding:10px;border-radius:10px;line-height:1.55}

.pita-wrap{padding-bottom:0!important}.pita-kunci{display:flex;gap:8px;align-items:center;background:var(--kuning-muda);color:#6B5200;border-radius:12px;padding:9px 12px;font-size:13px;margin:6px 0 10px}.pita-kunci .i{width:18px;height:18px;flex:none}
.pita-kunci a{color:var(--biru);font-weight:600;margin-left:auto;white-space:nowrap}
.akhir-atas>b{display:block;font-size:18px;margin:2px 0 12px}
.langkah{display:flex;flex-direction:column;gap:2px}
.lk{display:flex;gap:12px;align-items:center;padding:8px 0}
.lk .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--bg);color:var(--muted);border:1.5px solid var(--garis)}
.lk .no .i{width:16px;height:16px}
.lk.selesai .no{background:var(--hijau);border-color:var(--hijau);color:#fff}.lk.kini .no{background:var(--biru);border-color:var(--biru);color:#fff}.lk.awas .no{background:var(--kuning);border-color:var(--kuning);color:var(--ink)}
.lk div b{display:block;font-size:14px}.lk div small{font-size:12px;color:var(--muted)}.lk.nanti div b{color:var(--muted);font-weight:500}

.siap-baris .isi{flex:1;min-width:0;font-size:13px}.siap-baris .isi small{display:block;color:var(--muted);font-size:12px}
.bar-mini{height:7px;border-radius:9px;background:var(--bg);overflow:hidden;margin:5px 0 3px;max-width:320px}.bar-mini i{display:block;height:100%;background:var(--hijau);border-radius:9px}
.aksi-baris{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.kn-baris.ubah{box-shadow:0 0 0 2px var(--kuning),var(--bayang)}
.kn-ringkas{position:sticky;bottom:76px;z-index:5;margin-top:16px}

.arsip-kelas{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.periode{margin-bottom:10px;max-width:420px}
.rk-baris{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.tabel-hadir input{width:64px;height:36px;padding:0 8px;text-align:center}.tabel-hadir td{vertical-align:middle}

.anak-pilih button.on{background:var(--biru);color:#fff}

/* ---------- rekap ---------- */
var FR = { tab: 'santri', preset: 'bulan', mulai: '', sampai: '', kelas: null, harian: false };
function rentangPreset(p) {
  var t = S.boot.hariIni.tanggal, d = tglObj(t), f = function (x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); };
  if (p === 'minggu') { var s = new Date(d); s.setDate(d.getDate() - ((d.getDay() + 6) % 7)); var e = new Date(s); e.setDate(s.getDate() + 6); return [f(s), f(e)]; }
  if (p === 'bulan') return [t.slice(0, 8) + '01', f(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  if (p === 'semester') { var ta = S.boot.taAktif; return ta.semester === 'Genap' ? [ta.genapMulai, ta.genapSelesai] : [ta.ganjilMulai, ta.ganjilSelesai]; }
  return [FR.mulai || t, FR.sampai || t];
}
VIEW.rekap = function (el) {
  var kelasBoleh = lihatSemua() ? S.boot.kelas : S.boot.kelas.filter(function (k) { return S.boot.waliKelas.indexOf(k.id) >= 0; });
  if (!kelasBoleh.length && !lihatSemua()) { el.innerHTML = '<div class="kosong"><b>Rekap hanya untuk wali kelas dan mudir</b></div>'; return; }
  if (!FR.kelas || !kelasBoleh.some(function (k) { return k.id === FR.kelas; })) FR.kelas = kelasBoleh[0] && kelasBoleh[0].id;
  if (!lihatSemua()) FR.tab = 'santri';
  var r = rentangPreset(FR.preset); FR.mulai = r[0]; FR.sampai = r[1];
  el.innerHTML = (lihatSemua() ? '<div class="seg" style="max-width:420px;margin-bottom:12px"><button data-tab="santri" class="' + (FR.tab === 'santri' ? 'on' : '') + '">Rekap santri</button><button data-tab="guru" class="' + (FR.tab === 'guru' ? 'on' : '') + '">Rekap guru</button></div>' : '') +
    '<div class="filter" id="f-preset">' + [['minggu', 'Minggu ini'], ['bulan', 'Bulan ini'], ['semester', 'Semester ini'], ['bebas', 'Pilih tanggal']].map(function (x) { return '<button data-p="' + x[0] + '" class="' + (FR.preset === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (FR.preset === 'bebas' ? '<div class="grid2" style="max-width:420px">' + fld('Dari', 'r-mulai', FR.mulai, { tipe: 'date' }) + fld('Sampai', 'r-sampai', FR.sampai, { tipe: 'date' }) + '</div>' : '') +
    (FR.tab === 'santri' ? '<div class="filter" id="f-kelas-r">' + kelasBoleh.map(function (k) { return '<button data-k="' + k.id + '" class="' + (FR.kelas === k.id ? 'on' : '') + '">' + h(k.kode) + '</button>'; }).join('') + '</div>' : '') +
    '<div id="hasil-r"></div>';
  $$('[data-tab]', el).forEach(function (b) { b.onclick = function () { FR.tab = b.dataset.tab; VIEW.rekap(el); }; });
  $$('#f-preset button', el).forEach(function (b) { b.onclick = function () { FR.preset = b.dataset.p; VIEW.rekap(el); }; });
  $$('#f-kelas-r button', el).forEach(function (b) { b.onclick = function () { FR.kelas = b.dataset.k; VIEW.rekap(el); }; });
  if (FR.preset === 'bebas') ['r-mulai', 'r-sampai'].forEach(function (n) { $('[name=' + n + ']', el).onchange = function () { FR[n === 'r-mulai' ? 'mulai' : 'sampai'] = this.value; VIEW.rekap(el); }; });
  var box = $('#hasil-r');
  if (FR.tab === 'guru') muat(box, call('rekapGuru', { mulai: FR.mulai, sampai: FR.sampai }), function (d) { gambarRekap(box, d, 'guru'); });
  else if (FR.kelas) muat(box, call('rekapSantri', { kelasId: FR.kelas, mulai: FR.mulai, sampai: FR.sampai }), function (d) { gambarRekap(box, d, 'santri'); });
};
function gambarRekap(el, d, jenis) {
  var list = jenis === 'guru' ? d.guru : d.santri;
  var tot = { H: 0, S: 0, I: 0, A: 0 }; list.forEach(function (x) { ['H', 'S', 'I', 'A'].forEach(function (k) { tot[k] += x[k]; }); });
  var semua = tot.H + tot.S + tot.I + tot.A, rata = semua ? Math.round(tot.H / semua * 100) : null;
  var belum = jenis === 'guru' ? list.reduce(function (a, g) { return a + g.belum; }, 0) : d.belumDiisi.length;
  var periode = fRentang(d.mulai, d.sampai);
  var html = '<div class="stat-grid" style="margin-top:0">' +
    stat('kal', 'var(--biru-muda)', 'var(--biru)', d.hariEfektif.length, 'Hari sekolah') +
    stat('centang', 'var(--hijau-muda)', 'var(--hijau)', rata === null ? '-' : rata + '%', 'Rata-rata hadir') +
    stat('awas', belum ? 'var(--merah-muda)' : 'var(--hijau-muda)', belum ? 'var(--merah)' : 'var(--hijau)', belum, jenis === 'guru' ? 'Isian guru kosong' : 'Hari belum diisi') +
    stat('buku', 'var(--kuning-muda)', '#8A6A00', tot.S + tot.I + tot.A, 'Total tidak hadir') + '</div>';
  if (jenis === 'santri' && d.belumDiisi.length) html += '<div class="peringatan" style="margin-top:12px">' + ik('awas') + '<span>Belum diisi: ' + d.belumDiisi.map(function (t) { return fTgl(t); }).join(', ') + '</span></div>';
  html += '<div class="judul-bag"><h2>' + (jenis === 'guru' ? 'Kehadiran guru' : 'Kehadiran santri ' + h(d.kelas.kode)) + ' · ' + h(periode) + '</h2>' +
    '<label class="cek-mini"><input type="checkbox" id="cb-harian"' + (FR.harian ? ' checked' : '') + '> Harian</label></div>';
  if (!list.length) html += '<div class="kosong"><b>Belum ada data</b></div>';
  else if (FR.harian) {
    html += '<div class="tabel-wrap gulir-x" style="max-height:none"><table class="tabel matriks"><thead><tr><th class="lekat">Nama</th>' + d.hariEfektif.map(function (t) { var x = tglObj(t); return '<th>' + x.getDate() + '<br><small>' + HARI[x.getDay()].slice(0, 3) + '</small></th>'; }).join('') + '</tr></thead><tbody>' +
      list.map(function (x) { return '<tr><td class="lekat">' + h(x.panggilan || x.nama) + '</td>' + d.hariEfektif.map(function (t) { var st = x.harian[t]; return '<td' + (st ? ' style="background:' + ST[st].bg + ';color:' + ST[st].c + '" title="' + h(x.catatan[t] || ST[st].t) + '"' : '') + '>' + (st || '·') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  } else {
    html += '<div class="daftar hanya-hp">' + list.map(function (x) {
      return '<div class="baris"><span class="inisial">' + h(inisial(x.nama)) + '</span><span class="isi"><b>' + h(x.nama) + '</b><span>H ' + x.H + ' · S ' + x.S + ' · I ' + x.I + ' · A ' + x.A + (jenis === 'guru' && x.belum ? ' · kosong ' + x.belum : '') + '</span>' +
        '<span class="bar-mini">' + ['H', 'S', 'I', 'A'].map(function (k) { var t = x.H + x.S + x.I + x.A; return t && x[k] ? '<i style="width:' + (x[k] / t * 100) + '%;background:' + ST[k].c + '"></i>' : ''; }).join('') + '</span></span>' +
        '<span class="persen">' + (x.persen === null ? '-' : x.persen + '%') + '</span></div>';
    }).join('') + '</div>' +
      '<div class="tabel-wrap hanya-laptop"><table class="tabel"><thead><tr><th>Nama</th>' + (jenis === 'santri' ? '<th>No. Induk</th>' : '') + '<th>Hadir</th><th>Sakit</th><th>Izin</th><th>Tanpa Ket.</th>' + (jenis === 'guru' ? '<th>Belum diisi</th>' : '') + '<th>% Hadir</th></tr></thead><tbody>' +
      list.map(function (x) { return '<tr style="cursor:default"><td><b style="font-weight:600">' + h(x.nama) + '</b></td>' + (jenis === 'santri' ? '<td>' + h(x.nis) + '</td>' : '') + '<td>' + x.H + '</td><td>' + (x.S || '-') + '</td><td>' + (x.I || '-') + '</td><td>' + (x.A || '-') + '</td>' + (jenis === 'guru' ? '<td>' + (x.belum || '-') + '</td>' : '') + '<td><b>' + (x.persen === null ? '-' : x.persen + '%') + '</b></td></tr>'; }).join('') + '</tbody></table></div>';
  }
  if (isAdmin()) html += '<div class="ekspor"><button class="btn btn-garis" id="b-pdf">' + ik('unggah') + 'Simpan PDF</button><button class="btn btn-garis" id="b-sheet">' + ik('lapis') + 'Buka di Google Sheet</button></div><p class="hint" style="margin:6px 4px">File disimpan di folder Google Drive "Laporan TB Al-Barkah". PDF bisa dibagikan ke pembina; Sheet bisa diunduh sebagai Excel lewat menu File → Download.</p>';
  el.innerHTML = html;
  $('#cb-harian', el).onchange = function () { FR.harian = this.checked; gambarRekap(el, d, jenis); };
  if (isAdmin()) {
    var arg = { jenis: jenis, kelasId: jenis === 'santri' ? d.kelas.id : '', mulai: d.mulai, sampai: d.sampai };
    var hasilFile = function (r, jenisFile) {
      lembar({ judul: jenisFile + ' siap', isi: '<div class="info sukses-info">' + ik('centang') + '<span><b>' + h(r.nama) + '</b> sudah disimpan di Google Drive.</span></div>',

  }

    var list = Object.keys(ubah).map(function (k) { var p = k.split('|'); return { santriId: p[0], indikatorId: p[1], nilai: ubah[k] }; });
    if (!list.length) return Promise.resolve();

      Object.keys(ubah).forEach(function (k) { delete ubah[k]; });

  S.autoSimpan = function () { return Object.keys(ubah).length ? simpan() : Promise.resolve(); };

  $('#b-cat-n', el).onclick = function () { $('#cat-n', el).classList.toggle('hidden'); this.classList.add('hidden'); $('#cat-n', el).focus(); };

  return '<div class="judul-bag"><h2>Penilaian semester ini</h2><span>' + (lihatSemua() || S.boot.waliKelas.length ? '<button class="btn btn-teks btn-kecil" data-ke="rapor">Rapor</button>' : '') + '<button class="btn btn-teks btn-kecil" data-ke="nilai">Buka</button></span></div><div class="kelas-grid">' + p.map(function (k) {
    if (!k.indikator) return '<div class="kartu pk" style="--k:' + k.warna + '"><div class="pk-atas"><span class="chip k" style="--k:' + k.warna + '">' + h(k.kode) + '</span><span class="pk-ket belum">Indikator belum diatur</span><button class="btn btn-utama btn-kecil" data-ke-ind="' + k.id + '">Atur</button></div></div>';
    return '<div class="kartu pk" style="--k:' + k.warna + '"><div class="pk-atas"><span class="chip k" style="--k:' + k.warna + '">' + h(k.kode) + '</span><span class="pk-ket" style="color:var(--muted)">' + (k.hanyaSaya ? k.indikator + ' indikator yang Anda ampu' : k.indikator + ' indikator') + '</span><button class="btn btn-garis btn-kecil" data-nilai-kelas="' + k.id + '">Nilai</button></div>' +
      '<div class="pk-angka"><b>' + k.persen + '%</b> sudah dinilai · ' + k.dinilai + '/' + k.total + '</div><div class="progres"><i style="width:' + k.persen + '%"></i></div>' +
      (k.lama ? '<div class="hint" style="margin-top:6px">' + k.lama + ' indikator belum diperbarui dalam 30 hari terakhir</div>' : '') + '</div>';
  }).join('') + '</div>';
}
function pasangPenilaianBeranda(el) {
  $$('[data-nilai-kelas]', el).forEach(function (b) { b.onclick = function () { FN.kelas = b.dataset.nilaiKelas; FN.santriId = null; FN.indikatorId = null; buka('nilai'); }; });
  $$('[data-ke-ind]', el).forEach(function (b) { b.onclick = function () { FI.kelas = b.dataset.keInd; buka('indikator'); }; });
}


/* ================= TAHAP 4: CATATAN HARIAN IQRA' & HAFALAN ================= */
var KL = { L: { t: 'Lancar', c: '#1E9E6A', bg: '#E5F5EE' }, R: { t: 'Ragu-ragu', c: '#B98A00', bg: '#FDF6DC' }, U: { t: 'Mengulang', c: '#E07012', bg: '#FDEEDF' }, B: { t: 'Belum bisa', c: '#D9435B', bg: '#FDEBEF' } };
var FC = { kelas: null, kategori: 'iqra', tanggal: null, lanjut: true };
function chipKl(k) { var x = KL[k]; return x ? '<span class="chip" style="background:' + x.bg + ';color:' + x.c + '">' + x.t + '</span>' : ''; }

VIEW.catatan = function (el) {
  var hariIni = S.boot.hariIni.tanggal;
  if (!FC.tanggal) FC.tanggal = hariIni;
  if (!FC.kelas || !kelasDari(FC.kelas)) FC.kelas = S.boot.waliKelas[0] || (S.boot.kelas[0] && S.boot.kelas[0].id);
  if (!FC.kelas) { el.innerHTML = '<div class="kosong"><b>Belum ada kelas</b></div>'; return; }
  el.innerHTML = navTanggal('tgl-cat', FC.tanggal, hariIni) +
    '<div class="filter">' + S.boot.kelas.map(function (k) { return '<button data-k="' + k.id + '" class="' + (k.id === FC.kelas ? 'on' : '') + '">' + h(k.kode) + '</button>'; }).join('') + '</div><div id="isi-cat"></div>';
  pasangNavTanggal(el, 'tgl-cat', FC.tanggal, hariIni, function (t) { FC.tanggal = t; VIEW.catatan(el); });
  $$('.filter [data-k]', el).forEach(function (b) { b.onclick = function () { FC.kelas = b.dataset.k; VIEW.catatan(el); }; });
  var box = $('#isi-cat', el);
  muat(box, call('catatanKonfig', { kelasId: FC.kelas }), function (konf) {
    var kats = konf.kategori.filter(function (k) { return k.boleh || pantau(); });
    if (!kats.length) { box.innerHTML = '<div class="kosong"><b>Anda bukan pencatat Iqra\' atau hafalan di kelas ini</b>' + h(konf.kategori.map(function (k) { return k.nama + ': ' + namaPencatat(k); }).join(' · ')) + '<br>Pilih kelas lain, atau minta mudir mengatur guru pencatat.</div>'; return; }
    if (!kats.some(function (k) { return k.kode === FC.kategori; })) FC.kategori = kats[0].kode;
    var kat = kats.filter(function (k) { return k.kode === FC.kategori; })[0];
    box.innerHTML = '<div class="seg seg-gulir">' + kats.map(function (k) { return '<button data-kat="' + k.kode + '" class="' + (k.kode === FC.kategori ? 'on' : '') + '">' + h(k.nama) + '</button>'; }).join('') + '</div>' +
      // [v1.11] siapa yang berhak mencatat tab ini, dan tombol Atur untuk mudir
      '<div class="pencatat-bar">' + ik('kartu') + '<span>Pencatat ' + h(kat.nama) + ': <b>' + h(namaPencatat(kat)) + '</b>' + (kat.subId ? ' · wali kelas' + (konf.kelas.waliNama ? ' (' + h(konf.kelas.waliNama) + ')' : '') + ' dan mudir selalu boleh' : '') + '</span>' +
      (isAdmin() && !pantau() ? '<button class="btn btn-garis btn-kecil" id="b-atur-pencatat">Atur</button>' : '') + '</div>' +
      '<div id="usulan-cat"></div><div id="daftar-cat"></div>';
    $$('[data-kat]', box).forEach(function (b) { b.onclick = function () { FC.kategori = b.dataset.kat; VIEW.catatan(el); }; });
    var bAtur = $('#b-atur-pencatat', box); if (bAtur) bAtur.onclick = function () { aturPencatat(konf, function () { VIEW.catatan(el); }); };
    muatUsulanBanner($('#usulan-cat', box), FC.kelas, function () { VIEW.catatan(el); });
    var dbox = $('#daftar-cat', box);
    var gambarDaftar = function () {
      muat(dbox, call('catatanDaftar', { kelasId: FC.kelas, kategori: kat.kode, tanggal: FC.tanggal }), function (d) {
        if (!d.santri.length) { dbox.innerHTML = '<div class="kosong"><b>Belum ada santri aktif di kelas ini</b></div>'; return; }
        var sudah = d.santri.filter(function (s) { return s.hariIni.length; }).length;
        dbox.innerHTML = '<div class="jumlah" style="margin-top:12px">' + sudah + ' dari ' + d.santri.length + ' santri sudah dicatat ' + (FC.tanggal === hariIni ? 'hari ini' : 'pada ' + fTgl(FC.tanggal)) + '</div>' +
          '<div class="progres" style="margin:0 2px 12px"><i style="width:' + Math.round(sudah / d.santri.length * 100) + '%"></i></div>' +
          '<div class="daftar">' + d.santri.map(function (s) {
            var t = s.terakhir;
            return '<div class="baris c-baris" data-s="' + s.id + '"><span class="inisial">' + h(inisial(s.nama)) + '</span><span class="isi"><b>' + h(s.nama) + '</b>' +
              (s.hariIni.length ? '<span>' + s.hariIni.map(function (x) { return h(x.label) + ' · ' + KL[x.kelancaran].t; }).join('; ') + '</span>'
                : t ? '<span>Terakhir: ' + h(t.label) + ' · ' + KL[t.kelancaran].t + ' · ' + h(tglPendek(t.tanggal)) + '</span>' : '<span>Belum ada catatan</span>') + '</span>' +
              '<button class="btn-ikon kecil" data-rw="' + s.id + '" title="Riwayat">' + ik('ulang') + '</button>' +
              (s.hariIni.length ? '<span class="chip hijau">' + ik('centang').replace('class="i ', 'class="i mini ') + 'Tercatat</span>' : pantau() ? '' : '<span class="chip biru">+ Catat</span>') + '</div>';
          }).join('') + '</div>';
        $$('.c-baris', dbox).forEach(function (row) {
          row.onclick = function (e) {
            if (e.target.closest('[data-rw]') || pantau()) return lembarRiwayatCatatan(row.dataset.s, gambarDaftar);
            formCatatan(d, kat, row.dataset.s, gambarDaftar);
          };
        });
      });
    };
    gambarDaftar();
  });
};

/* ---------- [v1.11] guru pencatat per kategori ---------- */
function namaPencatat(k) { return !k.subId ? 'Semua guru' : k.pencatat.length ? k.pencatat.map(function (g) { return g.nama; }).join(', ') : 'Semua guru'; }
function aturPencatat(konf, selesai) {
  var guru = S.boot.guru.filter(function (g) { return g.peran === 'guru'; });
  var pilih = {}; konf.kategori.forEach(function (k) { pilih[k.kode] = k.pencatat.map(function (g) { return g.id; }); });
  var blok = konf.kategori.map(function (k) {
    if (!k.subId) return '<div class="atur-kat"><h4>' + h(k.nama) + '</h4><p class="hint">Semua guru boleh mencatat. Kelas ini belum punya sub-aspek ' + h(k.nama) + ' di menu Indikator, jadi pencatatnya belum bisa dibatasi.</p></div>';
    return '<div class="atur-kat" data-kode="' + k.kode + '"><h4>' + h(k.nama) + '</h4><p class="hint" data-ket></p><div class="chip-pilih">' +
      guru.map(function (g) { return '<button type="button" data-g="' + g.id + '" class="' + (pilih[k.kode].indexOf(g.id) >= 0 ? 'on' : '') + '">' + h(g.nama) + '</button>'; }).join('') + '</div></div>';
  }).join('');
  lembar({ judul: 'Guru pencatat ' + konf.kelas.kode,
    isi: '<p class="hint" style="margin:0 0 10px">Ketuk nama guru yang boleh mencatat tiap tab. Bila tidak ada yang dipilih, semua guru boleh mencatat. Wali kelas' + (konf.kelas.waliNama ? ' (' + h(konf.kelas.waliNama) + ')' : '') + ' dan mudir selalu boleh.</p>' + blok +
      '<div class="info" style="margin-top:10px">' + ik('infoi') + '<span>Pengaturan ini sama dengan <b>pengampu sub-aspek</b> di menu Indikator. Guru yang dipilih juga menilai hafalan atau bacaan itu di menu Penilaian.</span></div>',
    kaki: '<button class="btn btn-garis" data-tutup2>Batal</button><button class="btn btn-utama" data-simpan>Simpan</button>',
    pasang: function (l) {
      var ket = function (blk) {
        var n = pilih[blk.dataset.kode].length;
        blk.querySelector('[data-ket]').textContent = n ? n + ' guru dipilih' : 'Tidak ada yang dipilih: semua guru boleh mencatat';
      };
      $$('.atur-kat[data-kode]', l.el).forEach(function (blk) {
        ket(blk);
        $$('[data-g]', blk).forEach(function (b) { b.onclick = function () {
          var arr = pilih[blk.dataset.kode], i = arr.indexOf(b.dataset.g);
          if (i >= 0) arr.splice(i, 1); else arr.push(b.dataset.g);
          b.classList.toggle('on', i < 0); ket(blk);
        }; });
      });
      l.$('[data-tutup2]').onclick = l.tutup;
      l.$('[data-simpan]').onclick = function () {
        var atur = {}; konf.kategori.forEach(function (k) { if (k.subId) atur[k.kode] = pilih[k.kode]; });
        proses(this, function () { return call('catatanPencatatSimpan', { kelasId: konf.kelas.id, atur: atur }); }).then(function (r) {
          l.tutup(); toast(r.diubah ? 'Guru pencatat tersimpan' : 'Tidak ada perubahan', 'sukses'); selesai();
        }, function () {});
      };
    } });
}

function formCatatan(d, kat, santriId, segarkan) {
  var s = d.santri.filter(function (x) { return x.id === santriId; })[0];
  var isi = Object.assign({}, s.isian), chip = [];
  var bagianItem = '';
  if (kat.kode === 'iqra') {
    bagianItem = '<div class="field"><label>Jilid</label><div class="jilid-pilih">' + [1, 2, 3, 4, 5, 6].map(function (j) { return '<button type="button" data-j="' + j + '" class="' + (String(j) === isi.item ? 'on' : '') + '">' + j + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><label>Halaman</label><div class="stepper"><button type="button" data-hal="-1">−</button><input class="input" name="halaman" inputmode="numeric" value="' + h(isi.halaman) + '"><button type="button" data-hal="1">+</button></div></div>';
  } else if (kat.kode === 'membaca') {
    bagianItem = '<div class="grid2">' + fld('Bacaan / buku', 'item', isi.item, { ph: 'mis. Bacalah jilid 1' }) + fld('Halaman', 'halaman', isi.halaman, { mode: 'numeric' }) + '</div>';
  } else {
    var jn = namaItemHafalan(kat.nama);
    bagianItem = fld(kat.nama, 'item', isi.item, { pilihan: kat.items.map(function (i) { return { v: i.id, t: i.teks }; }) }) +
      (kat.bisaTambah && !pantau() ? '<button type="button" class="tambah-haf" id="b-item-baru" style="padding-top:0;margin-top:-6px">' + ik('tambah') + jn.charAt(0).toUpperCase() + jn.slice(1) + ' belum ada di daftar? Tambahkan</button>' +
        '<div id="item-baru" hidden style="margin-bottom:14px">' + (kat.kode === 'surah' ? '<datalist id="dl-surah-c">' + DAFTAR_SURAH.map(function (x) { return '<option value="' + h(x) + '">'; }).join('') + '</datalist>' : '') +
        '<div style="display:flex;gap:8px"><input class="input" id="in-item-baru" maxlength="80" autocomplete="off"' + (kat.kode === 'surah' ? ' list="dl-surah-c" placeholder="Ketik, misalnya Al-Fil"' : ' placeholder="Nama ' + jn + '"') + '><button type="button" class="btn btn-utama" id="b-item-simpan" style="flex:none">Tambah</button></div>' +
        '<p class="hint" style="margin-top:6px">Masuk ke daftar ' + h(kat.nama) + ' kelas ini. Santri lain tidak terpengaruh.</p></div>' : '') +
      (kat.kode === 'surah' ? fld('Ayat (opsional)', 'rentang', isi.rentang || '', { ph: 'mis. ayat 1–5' }) : '');
  }
  lembar({ judul: s.nama, isi: '<div class="hint" style="margin:-6px 0 12px">' + h(kat.nama) + ' · ' + h(fTgl(d.tanggal, true)) + (s.terakhir ? ' · terakhir ' + h(s.terakhir.label) + ' (' + KL[s.terakhir.kelancaran].t + ')' : '') + '</div>' +
    '<form id="f-cat">' + bagianItem +
    '<div class="field"><label>Catatan cepat (opsional)</label><div class="chip-pilih">' + (kat.chip || []).map(function (c) { return '<button type="button" data-c="' + h(c) + '">' + h(c) + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><input class="input" name="catatan" maxlength="200" placeholder="Catatan lain (opsional)"></div>' +
    '<label class="field" style="margin-bottom:6px"><span style="font-size:12.5px;font-weight:500;color:var(--muted)">Ketuk kelancaran untuk menyimpan</span></label>' +
    '<div class="kl-pilih">' + ['L', 'R', 'U', 'B'].map(function (k) { return '<button type="button" data-kl="' + k + '" style="--c:' + KL[k].c + ';--b:' + KL[k].bg + '">' + KL[k].t + '</button>'; }).join('') + '</div>' +
    '<label class="cek-mini" style="margin-top:12px"><input type="checkbox" id="cb-lanjut"' + (FC.lanjut ? ' checked' : '') + '> Setelah menyimpan, lanjut ke santri berikutnya</label></form>',
    pasang: function (l) {
      var f = l.$('form');
      $$('[data-j]', f).forEach(function (b) { b.onclick = function () { $$('[data-j]', f).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); isi.item = b.dataset.j; }; });
      $$('[data-hal]', f).forEach(function (b) { b.onclick = function () { var v = Math.max(1, (+f.halaman.value || 1) + (+b.dataset.hal)); f.halaman.value = v; }; });
      $$('[data-c]', f).forEach(function (b) { b.onclick = function () { b.classList.toggle('on'); var c = b.dataset.c, i = chip.indexOf(c); if (i >= 0) chip.splice(i, 1); else chip.push(c); }; });
      $('#cb-lanjut', f).onchange = function () { FC.lanjut = this.checked; };
      var bBaru = $('#b-item-baru', f);
      if (bBaru) {
        bBaru.onclick = function () { bBaru.hidden = true; $('#item-baru', f).hidden = false; $('#in-item-baru', f).focus(); };
        $('#in-item-baru', f).onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#b-item-simpan', f).click(); } };
        $('#b-item-simpan', f).onclick = function () {
          var teks = $('#in-item-baru', f).value.trim(); if (!teks) return toast('Nama wajib diisi.', 'galat');
          proses(this, function () { return call('hafalanTambah', { subId: kat.subId, teks: teks }); }).then(function (r) {
            if (!kat.items.some(function (i) { return i.id === r.id; })) {
              kat.items.push({ id: r.id, teks: r.teks });
              var o = document.createElement('option'); o.value = r.id; o.textContent = r.teks; f.item.appendChild(o);
            }
            f.item.value = r.id; $('#item-baru', f).hidden = true; bBaru.hidden = false; $('#in-item-baru', f).value = '';
            toast(r.sudahAda ? '"' + r.teks + '" sudah ada di daftar, langsung dipilih' : '"' + r.teks + '" ditambahkan dan dipilih', 'sukses');
          }, function () {});
        };
      }
      $$('[data-kl]', f).forEach(function (b) {
        b.onclick = function () {
          var data = { santriId: s.id, kategori: kat.kode, tanggal: d.tanggal, kelancaran: b.dataset.kl, chip: chip, catatan: f.catatan.value.trim() };
          if (kat.kode === 'iqra') { data.item = isi.item; data.halaman = f.halaman.value.trim(); }
          else { data.item = f.item.value.trim(); if (f.halaman) data.halaman = f.halaman.value.trim(); if (f.rentang) data.rentang = f.rentang.value.trim(); }
          $$('[data-kl]', f).forEach(function (x) { x.disabled = true; });
          b.innerHTML = '<span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:' + KL[b.dataset.kl].c + '"></span>';
          call('catatanSimpan', data).then(function (r) {
            toast(s.panggilan + ' · ' + r.label + ' · ' + KL[data.kelancaran].t, 'sukses');
            s.hariIni.push({ label: r.label, kelancaran: data.kelancaran });
            l.tutup(); segarkan();
            if (FC.lanjut) {
              var idx = d.santri.indexOf(s), berikut = d.santri.slice(idx + 1).concat(d.santri.slice(0, idx)).filter(function (x) { return !x.hariIni.length; })[0];
              if (berikut) setTimeout(function () { formCatatan(d, kat, berikut.id, segarkan); }, 250);
              else toast('Semua santri sudah tercatat', 'sukses');
            }
          }, function (e) {
            toast(e.message, 'galat');
            $$('[data-kl]', f).forEach(function (x) { x.disabled = false; x.innerHTML = KL[x.dataset.kl].t; });
          });
        };
      });
    } });
}

function lembarRiwayatCatatan(santriId, segarkan) {
  var l = lembar({ judul: 'Riwayat catatan', isi: '<div class="memuat" style="min-height:120px"><div class="spin"></div></div>' });
  var gambar = function () {
    call('catatanRiwayat', { santriId: santriId }).then(function (d) {
      $('.lembar-kepala h3', l.el).textContent = 'Riwayat · ' + d.santri.panggilan;
      var r = d.ringkasan, html = '';
      if (r && r.jumlah) {
        var haf = Object.keys(r.hafalan).map(function (k) { return r.hafalan[k]; });
        html += '<div class="kartu ringkas-cat"><b>Semester ini</b>' +
          (r.iqra ? '<div>Iqra\': <b>Jilid ' + r.iqra.jilid + ' hal. ' + r.iqra.halaman + '</b> (' + KL[r.iqra.kelancaran].t.toLowerCase() + ')</div>' : '') +
          '<div class="rn-sebaran">' + ['L', 'R', 'U', 'B'].map(function (k) { return chipKl(k).replace('</span>', ' · ' + r.kelancaran[k] + '</span>'); }).join('') + '</div>' +
          (haf.length ? '<div class="hint" style="margin-top:6px">Hafalan lancar: ' + h(haf.filter(function (x) { return x.lancar; }).map(function (x) { return x.teks + ' (' + x.lancar + '×)'; }).join(', ') || '-') + '</div>' : '') +
          (r.chipSering.length ? '<div class="hint">Sering dicatat: ' + h(r.chipSering.map(function (x) { return x.chip + ' (' + x.jumlah + '×)'; }).join(', ')) + '</div>' : '') + '</div>';
      }
      html += d.list.length ? '<div class="riwayat">' + d.list.map(function (c) {
        var bolehHapus = isAdmin() || c.guruId === S.boot.saya.id;
        return '<div class="rw"><div class="rw-tgl">' + h(fTgl(c.tanggal)) + '<br><small>' + h(c.waktu.slice(11, 16)) + '</small></div><div class="rw-isi"><b>' + h(c.label) + '</b><div>' + chipKl(c.kelancaran) + (c.chip ? '<small>' + h(c.chip) + '</small>' : '') + '</div>' +
          '<small>' + (c.catatan ? '"' + h(c.catatan) + '" · ' : '') + 'oleh ' + h(c.guru) + '</small></div>' + (bolehHapus ? '<button class="btn-ikon kecil" data-hapus="' + c.id + '" title="Hapus">' + ik('sampah') + '</button>' : '') + '</div>';
      }).join('') + '</div>' : '<div class="kosong" style="padding:20px"><b>Belum ada catatan</b></div>';
      $('.lembar-isi', l.el).innerHTML = html;
      $$('[data-hapus]', l.el).forEach(function (b) {
        b.onclick = function () {
          konfirmasi({ judul: 'Hapus catatan?', pesan: 'Catatan ini akan dihapus dari riwayat.', ya: 'Hapus', bahaya: true }).then(function (y) {
            if (y) call('catatanHapus', { id: b.dataset.hapus }).then(function () { toast('Catatan dihapus', 'sukses'); gambar(); if (segarkan) segarkan(); }, function (e) { toast(e.message, 'galat'); });
          });
        };
      });
    }, function (e) { $('.lembar-isi', l.el).innerHTML = '<p class="hint">' + h(e.message) + '</p>'; });
  };
  gambar();
}

function muatUsulanBanner(box, kelasId, selesai) {
  if (pantau()) { box.innerHTML = ''; return; }
  call('usulanNilai', { kelasId: kelasId }).then(function (d) {
    if (!d.usulan.length) { box.innerHTML = ''; return; }

/** Tampilkan dokumen rapor: di tab baru bila bisa, kalau tidak di lapisan pratinjau dalam aplikasi. */
function tampilkanDokumen(doc, jendela, bisaCetak, judulPratinjau) {
  if (jendela && !jendela.closed) {
    try { jendela.document.open(); jendela.document.write(doc); jendela.document.close(); return; } catch (e) { try { jendela.close(); } catch (e2) {} }
  }
  var w = document.createElement('div');
  w.className = 'pratinjau';
  w.innerHTML = '<div class="pt-bar"><b>' + (judulPratinjau || 'Pratinjau rapor') + '</b>' + (bisaCetak ? '<button class="btn btn-utama btn-kecil" data-cetak>' + ik('rapor') + 'Cetak</button>' : '') + '<button class="btn-ikon" data-tutup aria-label="Tutup">' + ik('x') + '</button></div><iframe title="Pratinjau rapor"></iframe>';
  document.body.appendChild(w);
  var fr = w.querySelector('iframe');
  fr.srcdoc = doc.replace('<div class="toolbar"', '<div class="toolbar" style="display:none"');
  var tutup = function () { w.remove(); tumpukan = tumpukan.filter(function (x) { return x !== tutup; }); };
  tumpukan.push(tutup);
  w.querySelector('[data-tutup]').onclick = tutup;
  var c = w.querySelector('[data-cetak]');
  if (c) c.onclick = function () { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('Browser menolak mencetak dari sini. Izinkan pop-up untuk aplikasi ini lalu coba lagi.', 'galat'); } };
}
function pratinjauRapor(ids) {
  var l = lembar({ judul: 'Menyiapkan pratinjau…', isi: '<div class="memuat" style="min-height:120px"><div class="spin"></div></div>' });
  Promise.all([call('raporKelas', perP({ kelasId: FRP.kelas, santriIds: ids })), ambilAset()]).then(function (r) {
    l.tutup(); tampilkanDokumen(buatDokumenRapor(r[0], { bagian: { sampul: 1, ringkasan: 1, kualitatif: 1, khusus: 1, keluarga: 1, naratif: 1 }, bisaCetak: isAdmin() }, r[1]), null, isAdmin());
  }, function (e) { l.tutup(); if (e.kode !== 'SESI') toast(e.message, 'galat'); });
}

function editorNaratif(el) {

    var m = r[0], urut = r[1].santri.map(function (s) { return s.id; }), idx = urut.indexOf(m.santri.id);
    var ubah = {};
    var html = '<div class="detail-atas"><button class="btn btn-garis btn-kecil" id="b-kembali">' + ik('kiri') + 'Daftar</button><div class="da-nama"><b>' + h(m.santri.nama) + '</b><span>Naratif · ' + h(m.kelas.kode) + ' · Semester ' + h(m.semester) + ' · predikat umum ' + h(m.predikatUmum) + '</span></div>' +
      '<button class="btn-ikon" id="b-prev"' + (idx <= 0 ? ' disabled' : '') + '>' + ik('kiri') + '</button><button class="btn-ikon" id="b-next"' + (idx >= urut.length - 1 ? ' disabled' : '') + '>' + ik('kanan') + '</button></div>' +
      '<div class="info">' + ik('infoi') + '<span>Draf dibuat otomatis dari nilai dan catatan harian. Sunting sesuai pengamatan Anda; teks yang sudah disunting tidak akan ditimpa otomatis.</span></div>' +
      '<div style="display:flex;justify-content:flex-end;margin:-4px 0 6px"><button class="btn btn-teks btn-kecil" id="b-pratinjau">' + ik('mata') + 'Pratinjau rapor</button></div>';
    BAGIAN_NARATIF_UI.forEach(function (b) {
      var n = m.naratif[b], a = m.aspek.filter(function (x) { return x.kode === b; })[0];
      if (!n) return;  // [v1.12] 'keluarga' hanya ada bila kelas punya program rumah
      html += '<div class="kartu nr-edit" data-b="' + b + '" style="--a:' + (a ? a.warna : b === 'keluarga' ? '#E0A800' : '#135EDD') + '"><div class="nr-edit-atas"><b>' + h(JUDUL_NARATIF[b]) + '</b>' +
        (n.manual ? '<span class="chip kuning">Diedit manual' + (n.oleh ? ' · ' + h(n.oleh) : '') + '</span>' : '<span class="chip">Otomatis</span>') + '</div>' +
        (n.berubah ? '<div class="peringatan nr-berubah">' + ik('awas') + '<span>Nilai berubah sejak paragraf ini disunting.</span><button class="btn btn-garis btn-kecil" data-draf-baru>Pakai draf baru</button><button class="btn btn-teks btn-kecil" data-tetap>Tetap pakai teks saya</button></div>' : '') +
        '<textarea class="input nr-teks" rows="4">' + h(n.teks) + '</textarea>' +
        '<div class="nr-edit-bawah">' + (n.manual ? '<button class="btn btn-teks btn-kecil" data-kembali>' + ik('ulang') + 'Kembalikan ke draf otomatis</button>' : '<span class="hint">' + (a && a.predikat ? 'Predikat aspek: ' + h(a.predikat) : '') + '</span>') +
        '<button class="btn btn-utama btn-kecil hidden" data-simpan>' + ik('centang') + 'Simpan</button></div>' +
        (n.manual ? '<details class="nr-draf"><summary>Lihat draf otomatis terbaru</summary><p>' + h(n.otomatis) + '</p></details>' : '') + '</div>';
    });
    el.innerHTML = html;
    var simpanSemua = function () {
      var keys = Object.keys(ubah); if (!keys.length) return Promise.resolve();
      return keys.reduce(function (pr, b) { return pr.then(function () { return call('naratifSimpan', perP({ santriId: m.santri.id, bagian: b, teks: ubah[b] })).then(function () { delete ubah[b]; }); }); }, Promise.resolve())
        .then(function () { toast('Naratif tersimpan', 'sukses'); });
    };
    S.autoSimpan = simpanSemua;
    var pindah = function (id) { simpanSemua().then(function () { FRP.santriId = id; VIEW.rapor(el); window.scrollTo(0, 0); }, function (e) { toast(e.message, 'galat'); }); };
    $('#b-kembali', el).onclick = function () { pindah(null); };

    $$('.nr-edit', el).forEach(function (k) {
      var b = k.dataset.b, ta = $('.nr-teks', k), awal = ta.value, tombol = $('[data-simpan]', k);

      var db = $('[data-draf-baru]', k); if (db) db.onclick = function () { call('naratifSimpan', perP({ santriId: m.santri.id, bagian: b, kembalikan: true })).then(function () { delete ubah[b]; toast('Memakai draf baru', 'sukses'); editorNaratif(el); }, function (e) { toast(e.message, 'galat'); }); };

    });

function viewKenaikan(el) {
  muat(el, call('kenaikanDraf'), function (d) {
    var kep = {}, awal = {};
    d.santri.forEach(function (s) { kep[s.id] = awal[s.id] = s.usul.hasil + '|' + (s.usul.kelasId || ''); });
    d.istirahat.forEach(function (s) { kep[s.id] = awal[s.id] = 'Tetap|'; });
    var kodeK = function (id) { var k = d.kelas.filter(function (x) { return x.id === id; })[0]; return k ? k.kode : ''; };
    var opsiAktif = function (s) {
      var o = d.kelas.filter(function (k) { return k.id !== s.kelasId; }).map(function (k) { return ['Naik|' + k.id, 'Naik ke ' + k.kode]; });
      return o.concat([['Tinggal|', 'Tinggal di ' + kodeK(s.kelasId)], ['Lulus|', 'Lulus'], ['Istirahat|', 'Istirahat'], ['Keluar|', 'Keluar']]);
    };
    var opsiIst = [['Tetap|', 'Tetap istirahat']].concat(d.kelas.map(function (k) { return ['Aktifkan|' + k.id, 'Aktifkan di ' + k.kode]; })).concat([['Keluar|', 'Keluar']]);
    var baris = function (s, opsi, ket) {
      return '<div class="baris kn-baris" data-sb="' + s.id + '"><span class="inisial">' + h(inisial(s.nama)) + '</span><span class="isi"><b>' + h(s.nama) + '</b><span>' + ket + '</span></span>' +
        '<select class="input kn-pilih" data-kp="' + s.id + '" aria-label="Keputusan untuk ' + h(s.nama) + '">' + opsi.map(function (o) { return '<option value="' + o[0] + '"' + (kep[s.id] === o[0] ? ' selected' : '') + '>' + h(o[1]) + '</option>'; }).join('') + '</select></div>';
    };
    var html = '<div class="detail-atas"><button class="btn btn-garis btn-kecil" id="b-kembali">' + ik('kiri') + 'Kembali</button><div class="da-nama"><b>Kenaikan kelas</b><span>' + h(d.taAsal.nama) + ' → tahun ajaran baru</span></div></div>' +
      '<div class="kartu">' + fld('Tahun ajaran tujuan', 'taTujuan', d.taTujuan, { hint: 'Dibuat otomatis bila belum ada (Juli–Desember, Januari–Juni).' }) +
      '<label class="cek"><input type="checkbox" id="cb-aktifkan" checked><span>Langsung aktifkan tahun ajaran baru<small>Mulai semester Ganjil dengan penilaian baru.</small></span></label>' +
      '<p class="hint">Periksa keputusan setiap santri. Baris yang diubah dari usulan ditandai garis kuning. Rapor tahun ini tetap tersimpan di arsip dan nomor induk tidak berubah.</p></div>';
    d.kelas.forEach(function (k) {
      var anggota = d.santri.filter(function (s) { return s.kelasId === k.id; });
      if (!anggota.length) return;
      html += '<div class="judul-bag"><h2><span class="chip k" style="--k:' + k.warna + '">' + h(k.kode) + '</span> ' + anggota.length + ' santri</h2></div><div class="daftar">' +
        anggota.map(function (s) { return baris(s, opsiAktif(s), 'No. Induk ' + h(s.nis)); }).join('') + '</div>';
    });
    if (d.istirahat.length) html += '<div class="judul-bag"><h2>Santri istirahat</h2></div><div class="daftar">' + d.istirahat.map(function (s) { return baris(s, opsiIst, 'No. Induk ' + h(s.nis) + ' · sedang istirahat'); }).join('') + '</div>';
    if (d.tanpaKelas.length) html += '<div class="peringatan" style="margin-top:14px">' + ik('awas') + '<span>' + d.tanpaKelas.length + ' santri aktif belum punya kelas di ' + h(d.taAsal.nama) + ': ' + h(d.tanpaKelas.map(function (s) { return s.nama; }).join(', ')) + '. Mereka tetap aktif tanpa kelas; atur kelasnya di menu Santri setelah kenaikan.</span></div>';
    html += '<div class="kartu kn-ringkas"><div id="kn-hitung"></div><div class="aksi-baris" style="justify-content:flex-end"><button class="btn btn-utama" id="b-proses">' + ik('naik') + 'Proses kenaikan kelas</button></div></div>';
    el.innerHTML = html;
    var hitung = function () {
      var c = {}; Object.keys(kep).forEach(function (id) { var x = kep[id].split('|'); var t = x[0] === 'Naik' ? 'Naik ke ' + kodeK(x[1]) : x[0] === 'Aktifkan' ? 'Diaktifkan di ' + kodeK(x[1]) : HASIL_UI[x[0]]; c[t] = (c[t] || 0) + 1; });
      $('#kn-hitung', el).innerHTML = Object.keys(c).map(function (t) { return '<span class="chip ' + (/^Naik|Diaktifkan/.test(t) ? 'biru' : t === 'Lulus' ? 'hijau' : /Tinggal|Istirahat/.test(t) ? 'kuning' : t === 'Keluar' ? 'merah' : '') + '">' + h(t) + ' · ' + c[t] + '</span>'; }).join('');
      return c;
    };
    hitung();
    $$('[data-kp]', el).forEach(function (sel) { sel.onchange = function () { kep[sel.dataset.kp] = sel.value; $('[data-sb="' + sel.dataset.kp + '"]', el).classList.toggle('ubah', sel.value !== awal[sel.dataset.kp]); hitung(); }; });
    $('#b-kembali', el).onclick = function () { FA.mode = 'ringkas'; VIEW.akhir(el); };

        if (!y) return;
        var keputusan = Object.keys(kep).map(function (id) { var x = kep[id].split('|'); return { santriId: id, hasil: x[0], kelasId: x[1] }; });
        proses(btn, function () { return call('kenaikanProses', { taTujuan: tujuan, keputusan: keputusan, aktifkan: aktifkan }); }).then(function (r) {
          FA.mode = 'ringkas'; S.cache = {};
          var j = r.jumlah;
          lembar({ judul: 'Kenaikan kelas selesai', isi: '<div class="info sukses-info">' + ik('centang') + '<span>' + (r.aktif ? 'Tahun ajaran <b>' + h(r.taTujuan.nama) + '</b> sekarang aktif.' : 'Penempatan kelas ' + h(r.taTujuan.nama) + ' sudah disiapkan.') + '</span></div>' +
            '<div class="rk-baris"><span>Naik kelas</span><b>' + j.Naik + '</b></div><div class="rk-baris"><span>Tinggal kelas</span><b>' + j.Tinggal + '</b></div><div class="rk-baris"><span>Lulus</span><b>' + j.Lulus + '</b></div><div class="rk-baris"><span>Istirahat</span><b>' + j.Istirahat + '</b></div><div class="rk-baris"><span>Keluar</span><b>' + j.Keluar + '</b></div>' + (j.Aktifkan ? '<div class="rk-baris"><span>Diaktifkan kembali</span><b>' + j.Aktifkan + '</b></div>' : '') +
            '<div class="sub-judul" style="margin-top:14px">Selanjutnya</div><p class="hint">1. Tambahkan santri baru di menu Santri.<br>2. Periksa tanggal semester di menu Tahun Ajaran.<br>3. Periksa wali kelas, indikator, dan tanggal rapor bila ada perubahan.</p>',
            kaki: '<button class="btn btn-utama" data-ok>Selesai</button>', pasang: function (l) { l.$('[data-ok]').onclick = l.tutup; }, saatTutup: function () { segarBoot().then(render); } });
        }, function () {});
      });
    };
  });

/* ================= tahap 7: tampilan wali santri ================= */
var FO = { anak: null, kat: 'semua' };
var KL_O = { L: { t: 'Lancar', c: '#1E9E6A' }, R: { t: 'Ragu-ragu', c: '#E0A800' }, U: { t: 'Mengulang', c: '#E07012' }, B: { t: 'Belum bisa', c: '#D9435B' } };
var LV_O = { BB: { t: 'BB', c: '#8A6D3F', bg: '#F3ECDF' }, MB: { t: 'MB', c: '#4F7F1D', bg: '#EEF6E3' }, BSH: { t: 'BSH', c: '#14714C', bg: '#E5F5EE' }, BSB: { t: 'BSB', c: '#8A6A00', bg: '#FFF4CC' } };
var KAT_O = { iqra: "Iqra'", surah: 'Surah', doa: 'Doa', hadits: 'Hadits', membaca: 'Membaca' };
function anakAktif() {
  var a = S.boot.anak || [];
  if (!FO.anak || !a.some(function (x) { return x.id === FO.anak; })) FO.anak = a[0] ? a[0].id : null;
  return a.filter(function (x) { return x.id === FO.anak; })[0];
}
function pilihAnak(el, gambar) {
  var a = S.boot.anak || []; if (a.length < 2) return '';
  setTimeout(function () { $$('[data-anak]', el).forEach(function (b) { b.onclick = function () { FO.anak = b.dataset.anak; gambar(el); }; }); });
  return '<div class="anak-pilih">' + a.map(function (x) { return '<button data-anak="' + x.id + '" class="' + (x.id === FO.anak ? 'on' : '') + '"><span class="inisial" style="background:' + h(x.warna) + ';color:#fff">' + h(inisial(x.nama)) + '</span>' + h(x.panggilan) + '</button>'; }).join('') + '</div>';
}
function tileO(n, t, c, bg) { return '<div class="tile" style="--t-c:' + c + ';--t-bg:' + bg + '"><b>' + (n || 0) + '</b><span>' + t + '</span></div>'; }
function iqraJalur(q) {
  if (!q) return '<p class="hint">Belum ada catatan Iqra\'.</p>';
  var p = Math.min(100, Math.round((q.halaman || 0) / 32 * 100));
  return '<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">Jilid ' + q.jilid + ' · halaman ' + q.halaman + '</b><span class="hint">' + h(tglPendek(q.tanggal)) + '</span></div>' +
    '<div class="iqra-jalur">' + [1, 2, 3, 4, 5, 6].map(function (j) { return '<i class="' + (j < q.jilid ? 'lewat' : j === q.jilid ? 'kini' : '') + '" style="--p:' + p + '%"></i>'; }).join('') + '</div>' +
    '<div class="iqra-label">' + [1, 2, 3, 4, 5, 6].map(function (j) { return '<span>' + j + '</span>'; }).join('') + '</div>';
}
function catO(c) {
  var tg = tglObj(c.tanggal), kl = KL_O[c.kelancaran] || { t: '', c: '#999' };
  var chips = String(c.chip || '').split(',').filter(Boolean);
  return '<div class="o-cat"><div class="tgl"><b>' + tg.getDate() + '</b>' + BULAN[tg.getMonth()].slice(0, 3) + '</div><div class="isi"><b>' + h(KAT_O[c.kategori] || c.kategori) + '</b> · ' + h(c.label) +
    '<small><span class="kl-dot" style="background:' + kl.c + '"></span>' + kl.t + (chips.length ? ' · perlu perhatian: ' + h(chips.join(', ')) : '') + '</small>' + (c.catatan ? '<small>“' + h(c.catatan) + '”</small>' : '') + '</div></div>';
}

      (d.lulus ? '<span class="chip kuning">Sudah lulus</span>' : (d.anak.kelas ? '<span class="chip kuning">' + h(d.anak.kelas) + '</span>' : '') + (d.waliKelas ? '<span class="chip">Wali kelas: ' + h(d.waliKelas) + '</span>' : '') + (d.ta ? '<span class="chip">Semester ' + h(d.ta.semester) + ' ' + h(d.ta.nama) + '</span>' : '')) + '</div></div>';
